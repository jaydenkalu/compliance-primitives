[package]
name = "allowlist-token"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Soroban token wrapper that only permits transfers between allowlisted addresses."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
compliance-pausable = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
denylist-gate = { path = "../denylist-gate", features = ["testutils"] }
denylist-gate-consumer = { path = "../../examples/denylist-gate-consumer", features = ["testutils"] }
compliance-test-trace = { path = "../../crates/test-trace" }

[features]
testutils = ["soroban-sdk/testutils", "compliance-pausable/testutils"]
