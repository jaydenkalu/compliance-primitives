[package]
name = "denylist-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone Soroban denylist that other contracts call before executing a transfer."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
compliance-pausable = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
compliance-pausable = { workspace = true, features = ["testutils"] }
audit-log = { path = "../audit-log" }

[features]
testutils = ["soroban-sdk/testutils", "compliance-pausable/testutils"]
