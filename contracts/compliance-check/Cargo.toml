[package]
name = "compliance-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared ComplianceCheck trait for compile-time composition across Soroban compliance contracts."
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
allowlist-token = { path = "../allowlist-token", features = ["testutils"] }
denylist-gate = { path = "../denylist-gate", features = ["testutils"] }
jurisdiction-flag = { path = "../jurisdiction-flag", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
