[workspace]
resolver = "2"
members = [
    "contracts/allowlist-token",
    "contracts/audit-log",
    "contracts/compliance-aggregator",
    "contracts/compliance-check",
    "contracts/denylist-gate",
    "contracts/jurisdiction-flag",
    "contracts/circuit-breaker",
    "contracts/policy-engine",
    "contracts/compliance-aggregator",
    "contracts/multisig-admin",
    "examples/denylist-gate-consumer",
    "examples/denylist-gate-sep41",
    "examples/jurisdiction-denylist-consumer",
    "examples/compliance-integration-flow",
    "examples/rwa-compliance-flow",
    "examples/multisig-governed-allowlist",
    "crates/test-trace",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellar-compliance-kit/compliance-primitives"

[workspace.dependencies]
soroban-sdk = "27.0.0"
compliance-pausable = { path = "contracts/pausable" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
